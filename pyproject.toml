[project]
name = "lensgraph"
version = "0.0.1"
description = "Multimodal video RAG over engineering conference talks. Eval-first."
authors = [{ name = "Aswin Sreenivas" }]
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format-nongpl]>=4.20",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.7",
    "FlagEmbedding>=1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["eval/tests"]
markers = ["slow: requires model load or live Postgres"]
addopts = "-m 'not slow'"
