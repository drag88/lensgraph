[project]
name = "lensgraph"
version = "0.0.1"
description = "Multimodal video RAG over engineering conference talks. Eval-first."
authors = [{ name = "Aswin Sreenivas" }]
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format-nongpl]>=4.20",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
